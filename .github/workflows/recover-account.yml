name: Recover account files only

on:
  push:
    branches: [master, prod]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref_name == 'prod' && 'thodiatienhai-prod-deploy' || 'fpt-production-deploy' }}
  cancel-in-progress: false

jobs:
  master:
    if: github.ref == 'refs/heads/master' && (startsWith(github.event.head_commit.message, 'recover-account-only:') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate recovery scope, guards and reviewed payload offline
        run: python3 scripts/test-account-recovery.py
      - name: Validate committed Elementor package without applying it
        run: php scripts/elementor/validate.php --git
      - name: Install master verification browser
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/elementor/requirements-browser.txt
          python3 -m playwright install --with-deps --only-shell chromium
      - name: Test account verification against a local JS and cookie challenge
        run: python3 scripts/test-account-recovery.py --browser RecoveryBrowserTests
      - name: Recover master account files and verify public forms
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/recover-account.py --environment master
      - name: Retain master file backups even if recovery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-recovery-master-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .account-recovery-backup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  prod:
    if: github.ref == 'refs/heads/prod' && (startsWith(github.event.head_commit.message, 'recover-account-only:') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test recovery guards and reviewed payload offline
        run: python3 scripts/test-account-recovery.py
      - name: Validate committed Elementor package without applying it
        run: php scripts/elementor/validate.php --git
      - name: Require successful master, back up prod, recover account files and verify
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST || '45.76.161.17' }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
          PROD_SSH_USER: ${{ vars.PROD_SSH_USER || 'root' }}
          PROD_WEB_ROOT: ${{ vars.PROD_WEB_ROOT || '/var/www/html' }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: python3 .github/scripts/recover-account.py --environment prod
