
name: Deploy PHP to FPT Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'recover-account-only:')
    name: Deploy to FTP Hosting
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ GitHub
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Prevent full deploy of an account recovery commit
        run: python3 .github/scripts/recover-account.py --guard-full-deploy

      - name: Set up deployment verification Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/elementor/requirements-browser.txt

      - name: Install JavaScript-capable verification browser
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/elementor/requirements-browser.txt
          python3 -m playwright install --with-deps --only-shell chromium

      - name: Validate committed Elementor package
        run: php scripts/elementor/validate.php --git

      - name: Test layout data preservation
        run: php scripts/elementor/test.php

      - name: Test frontend compatibility
        run: php scripts/test-compat.php

      - name: Test deployment status verification
        run: python3 scripts/elementor/test-deploy-check.py

      - name: Test fail-closed core version guard
        run: python3 scripts/test-prod-core-guard.py

      - name: Test browser challenge and cookie verification
        run: python3 -B scripts/elementor/test-browser-check.py

      # 2. Deploy qua FTP
      - name: Deploy to FTP Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./
          server-dir: /htdocs/

          # Không upload các file không cần thiết
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.githooks/**
            **/.layout-ready/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/__pycache__/**
            **/*.pyc
            **/.htaccess
            **/.user.ini
            **/.well-known/**
            **/.maintenance
            **/.vscode/**
            **/wp-config.php
            **/.codex-tools/**
            **/wp-content/cache/**
            **/wp-content/debug.log
            **/wp-content/uploads/**
            **/wp-content/upgrade/**
            **/wp-content/upgrade-temp-backup/**
            **/wp-content/duplicator-backups/**
            **/wp-content/updraft/**
            **/wp-content/ai1wm-backups/**
            **/wp-content/lk-layouts/ready.json
            **/wp-content/lk-layouts/applied.json
            **/wp-content/lk-layouts/*.tmp*
            **/.lk-layout-ftp-state.json
            **/*.sql
            **/*.sql.gz
            **/*.lnk

          # WordPress React and Elementor PHP dependencies live in vendor/.
          # They are part of the installed release and must be uploaded.

          # Không xóa toàn bộ thư mục hosting
          dangerous-clean-slate: false

          # Thời gian chờ kết nối
          timeout: 60000000

          log-level: verbose

      # Publish readiness only AFTER code, manifest and images finish uploading.
      - name: Prepare master layout release marker
        run: php scripts/elementor/ready.php --environment=master --commit="$GITHUB_SHA" --output=.layout-ready/ready.json

      - name: Publish master layout release marker last
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./.layout-ready/
          server-dir: /htdocs/wp-content/lk-layouts/
          state-name: .lk-layout-ftp-state.json
          dangerous-clean-slate: false
          timeout: 60000000

      - name: Apply and verify master Elementor release
        run: python3 scripts/elementor/check-deploy.py --environment master --commit "$GITHUB_SHA" --browser
